name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.1.1
        with:
          node-version-file: .nvmrc
          require-lockfile: true
          cache: true

      - name: Lint
        run: pnpm exec biome ci .

      - name: Test
        run: pnpm test
