<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>GuideAlong Tours Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.3.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="loading">Loading tours...</div>
    <div id="error"></div>
    <div id="controls" class="controls-hidden">
      <div class="sheet-handle" id="sheetHandle" aria-hidden="true">
        <span class="sheet-grabber"></span>
      </div>
      <div class="controls-header" id="controlsHeader">
        <div class="controls-header-title">
          <img src="favicon.svg" alt="" width="18" height="18" aria-hidden="true">
          <h3>GuideAlong Tours Explorer</h3>
        </div>
        <div class="controls-header-actions">
          <button type="button" class="sheet-expand" id="sheetExpand" aria-label="Expand controls" aria-expanded="false">
            <span class="sheet-chevron">▲</span>
          </button>
          <a
          class="github-link"
          href="https://github.com/setchy/guidealong-maps"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View source on GitHub"
          title="View source on GitHub"
        >
          <svg height="20" width="20" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
            -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
            0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27
            1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
            0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
        </a>
        </div>
      </div>
      <div class="filter-section search-section">
        <label id="lblSearch" for="searchInput">Search tours:</label>
        <div class="search-input-wrap">
          <svg class="search-input-icon" height="14" width="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or description" aria-labelledby="lblSearch">
          <span class="search-kbd">⌘K</span>
        </div>
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="filters-section" id="filtersSection">
        <button type="button" class="filters-toggle" id="filtersToggle" aria-expanded="true" aria-controls="filtersContent">
          <div class="filters-title">Filters</div>
          <span class="filters-toggle-arrow">▼</span>
        </button>
        <div id="filtersContent" class="filters-content">
          <div class="filter-section">
            <div id="lblCountry" class="filter-label">Country:</div>
            <div class="dropdown">
              <button type="button" class="dropdown-button" id="countryDropdownButton" aria-labelledby="lblCountry">
                Select Countries
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-content" id="countryDropdownContent">
                <div class="checkbox-item">
                  <input type="checkbox" id="allCountries" value="" checked>
                  <label for="allCountries">All Countries</label>
                </div>
              </div>
            </div>
          </div>
          <div class="filter-section">
            <div id="lblState" class="filter-label">State:</div>
            <div class="dropdown">
              <button type="button" class="dropdown-button" id="stateDropdownButton" aria-labelledby="lblState">
                Select States
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-content" id="stateDropdownContent">
                <div class="checkbox-item">
                  <input type="checkbox" id="allStates" value="" checked>
                  <label for="allStates">All States</label>
                </div>
              </div>
            </div>
          </div>
          <div class="filter-section">
            <div id="lblTourType" class="filter-label">Tour type:</div>
            <div class="dropdown">
              <button type="button" class="dropdown-button" id="tourTypeDropdownButton" aria-labelledby="lblTourType">
                All Tour Types
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-content" id="tourTypeDropdownContent"></div>
            </div>
          </div>
          <div class="filter-section">
            <div id="lblTourStatus" class="filter-label">Tour status:</div>
            <div class="dropdown">
              <button type="button" class="dropdown-button" id="statusDropdownButton" aria-labelledby="lblTourStatus">
                All Tours
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-content" id="statusDropdownContent">
                <div class="checkbox-item">
                  <input type="radio" id="allTours" name="tourStatus" value="all" checked>
                  <label for="allTours">All Tours</label>
                </div>
                <div class="checkbox-item">
                  <input type="radio" id="completedTours" name="tourStatus" value="completed">
                  <label for="completedTours">Completed Tours Only</label>
                </div>
                <div class="checkbox-item">
                  <input type="radio" id="incompleteTours" name="tourStatus" value="incomplete">
                  <label for="incompleteTours">Not Completed Tours Only</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="group-sort-section" id="groupSortSection">
        <button type="button" class="group-sort-toggle" id="groupSortToggle" aria-expanded="true" aria-controls="groupSortContent">
          <div class="group-sort-title">Group &amp; Sort</div>
          <span class="group-sort-toggle-arrow">▼</span>
        </button>
        <div id="groupSortContent" class="group-sort-content">
          <div class="filter-section">
            <div id="lblGroupBy" class="filter-label">Group by:</div>
            <div class="dropdown">
              <button type="button" class="dropdown-button" id="groupByDropdownButton" aria-labelledby="lblGroupBy">
                None
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-content" id="groupByDropdownContent">
                <div class="checkbox-item">
                  <input type="radio" id="groupByNone" name="groupBy" value="none">
                  <label for="groupByNone">None</label>
                </div>
                <div class="checkbox-item">
                  <input type="radio" id="groupByStatus" name="groupBy" value="status" checked>
                  <label for="groupByStatus">Status</label>
                </div>
                <div class="checkbox-item">
                  <input type="radio" id="groupByCategory" name="groupBy" value="category">
                  <label for="groupByCategory">Category</label>
                </div>
              </div>
            </div>
          </div>
          <div class="filter-section">
            <div id="lblSortBy" class="filter-label">Sort by:</div>
            <div class="dropdown">
              <button type="button" class="dropdown-button" id="sortByDropdownButton" aria-labelledby="lblSortBy">
                Title
                <span class="dropdown-arrow">▼</span>
              </button>
              <div class="dropdown-content" id="sortByDropdownContent">
                <div class="checkbox-item">
                  <input type="radio" id="sortByTitle" name="sortBy" value="title" checked>
                  <label for="sortByTitle">Title</label>
                </div>
                <div class="checkbox-item">
                  <input type="radio" id="sortByCompletedDate" name="sortBy" value="completedDate">
                  <label for="sortByCompletedDate">Completed date</label>
                </div>
                <div class="checkbox-item">
                  <input type="radio" id="sortByDistance" name="sortBy" value="distance">
                  <label for="sortByDistance">Distance</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="tour-list-section" id="tourListSection">
        <button type="button" class="tour-list-header" id="tourListToggle" aria-expanded="true" aria-controls="tourList">
          <div class="tour-title">Tours</div>
          <div class="tour-header-right">
            <div class="tour-count" id="tourCount">0 tours</div>
            <span class="tour-toggle-arrow">▼</span>
          </div>
        </button>
        <div class="tour-list" id="tourList"></div>
      </div>
      <div class="controls-footer">
        <span id="lastSynced"></span>
        <a href="https://guidealong.com/tour-list" target="_blank" rel="noopener noreferrer">View all tours on GuideAlong.com</a>
      </div>
      
    </div>
    <div id="map" style="height: 100vh"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
