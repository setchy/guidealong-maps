name: Refresh tour data

on:
  schedule:
    # Weekly: Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-tours
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          node-version-file: .nvmrc
          require-lockfile: true
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        # Enrichment drives a headless Chromium session (lib/enrich.js), so the
        # runner needs the Playwright browser matching the pinned playwright-core.
        run: pnpm exec playwright-core install chromium

      - name: Refresh tour data
        env:
          # Optional: geocoding is skipped when no key is present.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: pnpm fetch:tours

      - name: Run tests
        run: pnpm test

      - name: Commit and open pull request
        # Tour data changes go on a dedicated branch and open a PR (reviewed
        # merge) rather than being pushed straight to the branch being run on.
        # The default GITHUB_TOKEN cannot create PRs, so PR creation uses a
        # fine-grained PAT secret (GH_PAT) with "Pull requests: Read and
        # write"; without it, a warning with a manual PR link is printed.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/tours.json src/data/meta.json
          if git diff --cached --quiet; then
            echo "No tour data changes to commit."
            exit 0
          fi

          branch="data/refresh-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "chore: refresh tour data"
          git push origin "$branch"

          printf -v body 'Automated tour data refresh from the scheduled workflow.\n\nSee: %s' "${RUN_URL}"
          if ! gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "chore: refresh tour data" \
            --body "$body"; then
            echo "::warning::Could not open a pull request (the default GITHUB_TOKEN cannot create PRs). Open it manually: https://github.com/${GITHUB_REPOSITORY}/pull/new/${branch}"
          fi