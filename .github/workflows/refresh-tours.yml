name: Refresh tour data

on:
  schedule:
    # Weekly: Sunday 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-tours
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .nvmrc
          require-lockfile: true
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        # Enrichment drives a headless Chromium session (lib/enrich.js), so the
        # runner needs the Playwright browser matching the pinned playwright-core.
        run: pnpm exec playwright-core install chromium

      - name: Refresh tour data
        env:
          # Optional: geocoding is skipped when no key is present.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: pnpm fetch:tours

      - name: Run tests
        run: pnpm test

      - name: Check if tour data changed
        # Only raise a PR when the actual tour catalog (tours.json) changed.
        # meta.json's lastSynced timestamp bumps on every run; a timestamp-only
        # change should not open a pull request.
        id: tour-check
        run: |
          if git diff --quiet HEAD -- src/data/tours.json; then
            echo "tours.json unchanged; no pull request needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tours.json changed; opening pull request."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request for tour data changes
        if: steps.tour-check.outputs.changed == 'true'
        # Only runs when the gate step above found tour-data changes. Fixed
        # branch name means weekly runs update one PR instead of stacking new
        # ones.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          commit-message: "chore: refresh tour data"
          branch: data/tour-refresh
          base: ${{ github.ref_name }}
          title: "chore: refresh tour data"
          body: |
            Automated tour data refresh from the scheduled workflow.

            See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            src/data/tours.json
            src/data/meta.json
          delete-branch: true