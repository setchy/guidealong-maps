name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3.2.0
        with:
          node-version-file: .nvmrc
          require-lockfile: true
          cache: true

      - name: Lint
        run: pnpm lint:ci

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --offline
            "${{ github.workspace }}/src/**/*.html"
          fail: true
          failIfEmpty: true
          jobSummary: true

      - name: Test
        run: pnpm test
